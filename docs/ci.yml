name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  # Nightly: the systems' books against each other, across more seeds and
  # days than the test suite runs (src/sim/audit.rs).
  schedule:
    - cron: "17 7 * * *"

env:
  CARGO_TERM_COLOR: always

jobs:
  sim:
    name: sim (fmt, clippy, test, gates)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: sim
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --no-default-features -- -D warnings
      - run: cargo test --no-default-features
      - name: cross-system audit (two years, 30 seeds, every day)
        run: |
          cargo run --release --bin lab --no-default-features -- audit --seeds 30 --days 730 | tee audit.txt
          grep -q "^30/30 seeds clean" audit.txt
      - name: seed survey (two years, 30 seeds)
        run: cargo run --release --bin headless --no-default-features -- --survey 30 --days 730 | tail -1

  view:
    name: view (Bevy build, clippy, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: system libraries for Bevy
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: view
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --bin bleeding_kansas
